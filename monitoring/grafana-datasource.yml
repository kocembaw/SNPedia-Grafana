# Grafana data source provisioning.
# Deployed to /etc/grafana/provisioning/datasources/snpedia.yml by the Ansible "grafana" role.

apiVersion: 1

datasources:
  - name: Prometheus
    # The dashboard refers to the data source by this uid.
    uid: prometheus-snpedia
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches scrape_interval in prometheus.yml.
      timeInterval: 60s
